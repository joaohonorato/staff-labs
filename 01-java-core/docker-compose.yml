# Módulo 1 — Java Core
#
# Build (Maven roda dentro do container, não precisa de JDK na máquina):
#   docker compose run --rm mvn package
# Rodar um benchmark JMH numa LTS específica:
#   docker compose run --rm jdk25 java -jar target/benchmarks.jar Hello
#   docker compose run --rm jdk21 java -jar target/benchmarks.jar Hello
# Benchmark Go:
#   docker compose run --rm go go test -bench=. -benchmem ./hello/

x-java: &java
  working_dir: /work
  volumes:
    - ./java:/work

services:
  # Build com Maven no JDK 25. O jar sai com --release 17 (ver pom.xml),
  # então roda em 17, 21 e 25. Para o JDK 8, troque maven.compiler.release para 8.
  mvn:
    image: maven:3.9-eclipse-temurin-25
    working_dir: /work
    entrypoint: ["mvn", "-q", "-B"]
    volumes:
      - ./java:/work
      - m2:/root/.m2

  jdk25:
    <<: *java
    image: eclipse-temurin:25-jdk
  jdk21:
    <<: *java
    image: eclipse-temurin:21-jdk
  jdk17:
    <<: *java
    image: eclipse-temurin:17-jdk
  jdk8:
    <<: *java
    image: eclipse-temurin:8-jdk

  go:
    image: golang:1.25
    working_dir: /work
    volumes:
      - ./go:/work
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod

volumes:
  m2:
  gocache:
  gomod:
